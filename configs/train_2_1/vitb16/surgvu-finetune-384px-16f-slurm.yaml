  - -1
  - -1
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  vit_conv: false
  zero_init_mask_tokens: true
optimization:
  ema:
  - 0.99925
  - 0.99925
  epochs: 20
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: 100
  ipe_scale: 1.25
  lr: 1.0e-05
  start_lr: 1.0e-06
  warmup: 2
  weight_decay: 0.04
wandb:
  enable: true
  project: vjepa2
  name: run-001
  mode: offline
  log_freq: 1
  strict: true
