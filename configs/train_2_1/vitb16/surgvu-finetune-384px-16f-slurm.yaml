app: vjepa_2_1
nodes: 1
tasks_per_node: 4
cpus_per_task: 8
mem_per_gpu: 60G
exclusive: true
folder: output/surgvu_slurm/vjepa2_1_vitb_384px_16f
data:
  dataset_type: VideoDataset
  datasets:
  - data/surgvu/manifest_train.csv
  datasets_weights:
  - 1.0
  batch_size: 1
  crop_size: 384
  patch_size: 16
  dataset_fpcs:
  - 16
  tubelet_size: 2
  fps: 4
  filter_long_videos: null
  filter_short_videos: false
  preprocess_metadata: data/surgvu_metadata_train/preprocess_metadata.json
  use_preprocess_metadata: true
  length_weighted_sampling: true
  num_workers: 8
  pin_mem: true
data_aug:
  auto_augment: false
  motion_shift: false
  random_resize_aspect_ratio:
  - 0.75
  - 1.35
  random_resize_scale:
  - 0.3
  - 1.0
  reprob: 0.0
loss:
  loss_exp: 1.0
  predict_all: true
  reg_coeff: 0.0
  shift_by_n: 0
  weight_distance_loss: true
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 8
  spatial_scale:
  - 0.15
  - 0.15
  temporal_scale:
  - 1.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  full_complement: false
  max_keep: null
  max_temporal_keep: 1.0
  num_blocks: 2
  spatial_scale:
  - 0.7
  - 0.7
  temporal_scale:
  - 1.0
  - 1.0
meta:
  dtype: float16
  eval_freq: 100
  load_checkpoint: true
  read_checkpoint: checkpoints/vjepa2_1_vitb_dist_vitG_384.pt
  save_every_freq: 5
  seed: 239
  use_sdpa: true
model:
  compile_model: false
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  is_causal: false
  lambda_progressive: true
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  local_window:
  - -1
